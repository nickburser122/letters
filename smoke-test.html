<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><iframe id="f" src="index.html?test" style="width:1280px;height:800px"></iframe><script>
const f=document.getElementById('f');
f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument;w.localStorage.clear();
w.addEventListener('error',e=>console.error('ERR',e.message,e.lineno));
const s=ms=>new Promise(r=>setTimeout(r,ms));
const L=['عدد الجوابات\tالجهه\tاسم المستخدم\tالمركز\tالفرع'];
const B=['فرع البحيرة','فرع القاهرة','فرع الجيزة'],F=['مستشفى دمنهور العام','مستشفي دمنهور العام','مستشفى دمنهور  العامه','معمل البرج','معمل البرج للتحاليل','رمد طنطا','مركز الاشعة 1','مركز الاشعة 2'];
for(let i=0;i<4000;i++){const b=B[i%3];L.push((i%9+1)+'\t'+F[i%8]+' '+(i%40)+'\tمستخدم '+(i%37)+'\tمركز '+(i%11)+'\t'+(i%50===0?'':b));}
L.push('5\tرمد طنطا\t\t\t');
try{d.getElementById('data-input').value=L.join('\n');d.getElementById('btn-analyze').click();await s(1500);
console.log('v0',JSON.stringify(d.getElementById('data-input').value.slice(0,80)));console.log('err',d.getElementById('input-error').textContent,'dash',d.getElementById('view-dash').hidden,'acts',d.getElementById('tr-act').innerHTML.slice(0,200));
d.querySelector('[data-tab="tr"]').click();await s(300);console.log('acts2',d.getElementById('tr-act').innerHTML.slice(0,300));
d.querySelector('#tr-act [data-dp="4"]').click();await s(400);
console.log('cnt',d.getElementById('cnt-tr').textContent,'dom rows',d.querySelectorAll('#tr-body .tn').length,'pad h',d.getElementById('tr-body').style.height);
const sc=d.getElementById('tr-scroll');sc.scrollTop=20000;sc.dispatchEvent(new Event('scroll'));await s(200);
console.log('head',d.getElementById('tr-head').innerText.replace(/\s+/g,' '));
const q=d.getElementById('q-tr');q.value='دمنهور';q.dispatchEvent(new Event('input',{bubbles:true}));await s(400);
console.log('search',d.getElementById('cnt-tr').textContent,'marks',d.querySelectorAll('#tr-body mark').length);
q.value='';q.dispatchEvent(new Event('input',{bubbles:true}));await s(300);
const fr=d.querySelector('#tr-body .tn-r');fr.focus();
const k=key=>d.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));
k('ArrowDown');k('ArrowDown');await s(50);console.log('cur after down',d.querySelector('#tr-body .tn-r.cur').innerText.replace(/\s+/g,' ').slice(0,40));
k('ArrowRight');await s(50);console.log('after right(close in rtl?)',d.querySelector('#tr-body .tn-r.cur').closest('.tn').getAttribute('aria-expanded'));
k('ArrowLeft');await s(50);console.log('after left',d.querySelector('#tr-body .tn-r.cur').closest('.tn').getAttribute('aria-expanded'));
d.querySelector('[data-tab="qa"]').click();await s(800);
console.log('qa',d.getElementById('qa-body').innerText.replace(/\s+/g,' ').slice(0,700));
const mb=d.querySelector('[data-qmerge]');if(mb){mb.click();await s(800);console.log('after merge',d.querySelector('.qcards').innerText.replace(/\s+/g,' '));}
d.querySelector('[data-tab="fw"]').click();await s(500);console.log('fw',d.getElementById('cnt-fw').textContent);
d.querySelector('[data-tab="rp"]').click();await s(400);
d.getElementById('rp-toc').click();d.getElementById('rp-bre').click();d.getElementById('rp-trw').click();await s(400);
const pv=d.getElementById('preview');console.log('rp toc',pv.querySelectorAll('.rp-toc li').length,'br sections',pv.querySelectorAll('.rp-brh').length,'wide',pv.querySelectorAll('.rsec.wide').length);
console.log('scope after report',d.getElementById('scope').innerText);
d.querySelector('[data-tab="fw"]').click();
await asserts(w,d,s);
}catch(e){console.error('TEST',e.stack)}console.log('done');};

async function asserts(w,d,s){
let P=0,F=0;const ok=(n,c,dt)=>{if(c){P++;console.log('PASS '+n);}else{F++;console.log('FAIL '+n+': '+(dt||''));}};
const J=w.__jw;
if(!J){console.log('FAIL hook: __jw missing');return;}
const S=J.state;
let cap='';
const stub=(mode)=>{Object.defineProperty(w,'isSecureContext',{value:true,configurable:true});
Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:mode==='reject'?{write:()=>Promise.reject(new Error('x')),writeText:()=>Promise.reject(new Error('x'))}:{write:async it=>{cap=await(await it[0].getType('text/plain')).text();},writeText:async t=>{cap=t;}}});};
const nTabs=t=>(t.match(/\t/g)||[]).length;
const blocks=t=>t.split('\n\n');
d.querySelector('[data-tab="rp"]').click();await s(400);
const exs=[...d.querySelectorAll('[data-ex]')];
exs.forEach(c=>{const want=['cl','pe','loc'].includes(c.dataset.ex);if((c.getAttribute('aria-checked')==='true')!==want)c.click();});
stub('ok');cap='';d.getElementById('ex-copy').click();await s(300);
ok('B1 three titles',cap.includes('الجهات')&&cap.includes('المستخدمون')&&cap.includes('المواقع (فرع × مركز)'),cap.slice(0,80));
ok('B1 three blocks',blocks(cap).length===3,String(blocks(cap).length));
const all=['cl','pe','loc','pair','tree','cls','raw','kpi','ins','mixc','mixt','flow','qaMiss','qaMultiU','qaMultiC','qaDup'];
const X=J.serializeX(all,'tsv');
const bl=blocks(X.text);
ok('TSV block count',bl.length===all.length,bl.length+' vs '+all.length);
let shapeBad='',dashBad='';
bl.forEach((b,i)=>{const L=b.split('\n').slice(1);if(!L.length)return;const h=nTabs(L[0]);L.forEach(l=>{if(nTabs(l)!==h&&!shapeBad)shapeBad=all[i]+': '+l.slice(0,60);});
if(['cl','pe','loc','pair','tree','raw'].includes(all[i])&&L.some(l=>l.split('\t').includes('—'))&&!dashBad)dashBad=all[i];});
ok('TSV shape',!shapeBad,shapeBad);
ok('TSV no dash cells',!dashBad,dashBad);
const q=d.getElementById('q-cl');d.querySelector('[data-tab="cl"]').click();await s(300);
q.value='دمنهور';q.dispatchEvent(new Event('input',{bubbles:true}));await s(400);
const vr=J.tableOf('cl',{visibleOnly:true}).rows,cn=parseInt(d.getElementById('cnt-cl').textContent);
ok('Search count',vr.length===cn&&cn>0,vr.length+' vs '+cn);
ok('Search rows match',vr.every(r=>String(r[1]).includes('دمنهور')),'');
q.value='';q.dispatchEvent(new Event('input',{bubbles:true}));await s(300);
d.querySelector('#th-cl [data-sort="name"]').click();await s(300);
const dom=[...d.querySelectorAll('#tb-cl tr .c-f')].map(x=>x.textContent),cp=J.tableOf('cl',{visibleOnly:true}).rows.map(r=>r[1]);
ok('Sort order',dom.length===cp.length&&dom.every((v,i)=>v===cp[i]),dom.length+' vs '+cp.length);
const keep=S.facs[0].name;S.facs[0].name=keep+' | x';
const md=J.serialize(['cl'],'md'),ml=md.split('\n').filter(l=>l.startsWith('|')),pip=l=>(l.match(/(?<!\\)\|/g)||[]).length;
S.facs[0].name=keep;
ok('MD escapes pipe',md.includes('\\|'),'');
ok('MD pipe counts',ml.length>2&&ml.every(l=>pip(l)===pip(ml[0])),ml.length+'');
ok('MD align row',/^\|---:\|---\|---:\|---:\|/.test(ml[1]),ml[1]);
const tx=J.serialize(['cl','pe','loc','kpi','ins'],'txt');
ok('TXT no pipes',!tx.includes('|'),'');
ok('TXT no leading spaces',!tx.split('\n').some(l=>/^\s/.test(l)),'');
ok('TXT numbered',/\n1\. /.test(tx),'');
const tt=J.serialize([{key:'treei',o:{depth:2}}],'txt',{meta:false}),ind=tt.split('\n').map(l=>l.match(/^ */)[0].length);
ok('Tree depth limit',ind.length>0&&Math.max(...ind)<=2,Math.max(...ind)+'');
const tf=J.serialize(['tree'],'tsv');
ok('Tree flat 8 columns',tf.split('\n')[0].split('\t').length===8,'');
const tl=J.serialize(['cl'],'tsv',{total:true}).split('\n'),last=tl[tl.length-1].split('\t');
ok('Totals row',+last[2]===S.total&&last.includes('الإجمالي'),last.join('|'));
const lo=J.tableOf('loc',{visibleOnly:true}).rows.length;
d.querySelector('[data-tab="lo"]').click();await s(300);
ok('Locations rows',d.querySelectorAll('#lo-body tbody tr').length===lo,lo+'');
const pr=J.tableOf('pair',{visibleOnly:true,routes:true}).rows;
ok('Routes pair rows',pr.length>0,String(pr.length));

stub('ok');
ok('Toolbar buttons on 10 tabs',d.querySelectorAll('.cpb').length===10,String(d.querySelectorAll('.cpb').length));
d.querySelector('[data-tab="cl"]').click();await s(300);
const q2=d.getElementById('q-cl');q2.value='دمنهور';q2.dispatchEvent(new Event('input',{bubbles:true}));await s(300);
cap='';d.querySelector('#v-cl .cp-main').click();await s(300);
const vc=J.tableOf('cl',{visibleOnly:true}).rows.length;
ok('Tab copy visible rows',cap.split('\n').length===vc+1,cap.split('\n').length+' vs '+(vc+1));
q2.value='';q2.dispatchEvent(new Event('input',{bubbles:true}));await s(300);
cap='';d.dispatchEvent(new KeyboardEvent('keydown',{key:'C',ctrlKey:true,shiftKey:true,bubbles:true}));await s(300);
ok('Ctrl+Shift+C copies tab',cap.split('\n').length===J.tableOf('cl',{visibleOnly:true}).rows.length+1,String(cap.split('\n').length));
const rows=[...d.querySelectorAll('#tb-cl tr[data-key]')];
const clk=(el,o)=>el.dispatchEvent(new MouseEvent('click',Object.assign({bubbles:true,cancelable:true},o)));
clk(rows[1],{ctrlKey:true});clk(rows[3],{shiftKey:true});await s(200);
ok('Selection range',d.querySelectorAll('#tb-cl tr.sel').length===3,String(d.querySelectorAll('#tb-cl tr.sel').length));
ok('Selection label',d.querySelector('#v-cl .cp-main').textContent.includes('(3)'),d.querySelector('#v-cl .cp-main').textContent);
ok('Plain click not blocked by selection',!d.getElementById('drawer').classList.contains('open'),'');
cap='';d.dispatchEvent(new KeyboardEvent('keydown',{key:'c',ctrlKey:true,bubbles:true}));await s(300);
ok('Ctrl+C copies selected TSV',cap.split('\n').length===4&&cap.split('\n')[0].split('\t').length===10,cap.split('\n').length+'');
d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await s(200);
ok('Esc clears selection',d.querySelectorAll('#tb-cl tr.sel').length===0,'');
d.querySelector('#v-cl .cp-more').click();await s(300);
const cpn=d.getElementById('cpanel');
ok('Panel opens',!!cpn&&!cpn.hidden,'');
ok('Panel preview',d.getElementById('cp-prev').value.split('\n').length>2,'');
ok('Panel counter',/صف.*أعمدة.*ألف حرف/.test(d.getElementById('cp-cnt').textContent),d.getElementById('cp-cnt').textContent);
d.querySelector('#cp-fmt [data-f="md"]').click();await s(300);
ok('Panel markdown preview',d.getElementById('cp-prev').value.startsWith('### الجهات'),d.getElementById('cp-prev').value.slice(0,30));
const sv=JSON.parse(w.localStorage.getItem('jawabat.copy')||'null');
ok('Options persisted',!!sv&&sv.fmt==='md',JSON.stringify(sv));
cap='';d.getElementById('cp-copy').click();await s(300);
ok('Panel copy',cap.startsWith('### الجهات'),cap.slice(0,20));
d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));cpn.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await s(200);
ok('Panel Esc closes',cpn.hidden,'');
const sv0=JSON.parse(w.localStorage.getItem('jawabat.copy'));sv0.fmt='tsv';w.localStorage.setItem('jawabat.copy',JSON.stringify(sv0));
const secs=[...d.querySelectorAll('[data-sec]')].map(c=>[c.dataset.sec,c.textContent.trim()]);
Object.keys(S.rep.sec).forEach(k=>{S.rep.sec[k]=1;});S.rep.sec.qa=0;S.rep.brEach=false;S.rep.toc=true;
const rm=J.buildReportText(S.rep,'md');
const hasCls=S.facs.some(f=>f.cls||f.type),missing=secs.filter(x=>x[0]!=='qa'&&(x[0]!=='mix'||hasCls)&&!rm.includes('### '+x[1])).map(x=>x[1]);
ok('Report MD enabled headings',missing.length===0,missing.join(','));
ok('Report MD disabled heading absent',!rm.includes('### '+secs.find(x=>x[0]==='qa')[1]),'');
ok('Report MD starts with title and TOC',rm.startsWith('# ')&&rm.includes('## المحتويات'),rm.slice(0,40));
S.rep.brEach=true;const rb=J.buildReportText(S.rep,'txt');
ok('Report per-branch text',S.locs.length>0&&rb.includes('فرع البحيرة')&&!rb.includes('|'),'');
ok('Report restores filters',S.facs.length>0&&S.total>0,String(S.total));
const rt=J.buildReportText(S.rep,'txt');
ok('Report TXT no pipes',!rt.includes('|'),'');
S.rep.brEach=false;

const PV=o=>J.serializeX([{key:'pivot',o:{pv:o}}],'tsv',{header:true,meta:false});
let pv=PV({r:'facility',c:'branch',v:'n',top:0,tot:true}),pl=pv.text.split('\n'),ph=pl[0].split('\t');
ok('Pivot shape',pl.every(l=>l.split('\t').length===ph.length)&&ph.length>=3,ph.length+'');
ok('Pivot grand total',+pl[pl.length-1].split('\t').pop()===S.total,pl[pl.length-1]);
ok('Pivot row sums',pl.slice(1,-1).every(l=>{const c=l.split('\t').slice(1).map(Number);return c.slice(0,-1).reduce((a,b)=>a+b,0)===c[c.length-1];}),'');
pv=PV({r:'facility',c:'center',v:'n',top:3,tot:true});pl=pv.text.split('\n');ph=pl[0].split('\t');
ok('Pivot top N with other',ph.length===1+3+1+1&&ph.includes('أخرى'),ph.join('|'));
pv=PV({r:'facility',c:'branch',v:'pr',top:0,tot:true});pl=pv.text.split('\n');
ok('Pivot percent of row',pl.slice(1).every(l=>l.split('\t').pop()==='100%'||l.split('\t').pop()==='0%'),pl[1]);
pv=PV({r:'cls',c:'type',v:'pt',top:0,tot:false});
ok('Pivot class by type',pv.text.split('\n').length>=2,'');
const pmd=J.serialize([{key:'pivot',o:{pv:{r:'facility',c:'branch',v:'n',top:0,tot:true}}}],'md'),ptx=J.serialize([{key:'pivot',o:{pv:{r:'facility',c:'branch',v:'n',top:0,tot:true}}}],'txt');
ok('Pivot MD and TXT',pmd.includes('| الجهة |')&&!ptx.includes('|')&&ptx.includes(' — '),'');
d.querySelector('[data-tab="pv"]').click();await s(400);
const nb=d.querySelectorAll('#pv-tbl tbody tr').length,exp=J.TABLES.pivot.rows({}).length;
ok('Pivot renders',nb>0&&nb<=exp&&d.getElementById('pv-ctl').querySelectorAll('.dd').length===4,nb+' vs '+exp);
const pvdd=d.getElementById('pv-c');pvdd.dataset.v='center';pvdd.dispatchEvent(new CustomEvent('ddchange',{bubbles:true,detail:'center'}));await s(300);
ok('Pivot control updates table',d.querySelectorAll('#pv-tbl thead th').length>=4&&S.pv.c==='center',String(S.pv.c));
cap='';d.querySelector('#v-pv .cp-main').click();await s(300);
ok('Pivot tab copy',cap.split('\n')[0].split('\t')[0]==='الجهة'&&cap.split('\n').length>2,cap.slice(0,40));
const tn=J.serializeX([{key:'topn',o:{tn:{n:2,g:'center'}}}],'tsv',{meta:false}).text.split('\n').slice(1).map(l=>l.split('\t'));
const byG={};tn.forEach(r=>{(byG[r[0]]=byG[r[0]]||[]).push(r);});
ok('TopN at most N per group',tn.length>0&&Object.values(byG).every(g=>g.length<=2&&g[0][1]==='1'),Object.keys(byG).length+'');
ok('TopN percents',tn.every(r=>parseFloat(r[4])<=100),'');
d.querySelector('[data-tab="lo"]').click();await s(300);
d.querySelector('[data-tnb="show"][data-h="lo"]').click();await s(300);
ok('TopN table shown',d.querySelectorAll('#tn-lo tbody tr').length>0,'');
cap='';d.querySelector('[data-tnb="copy"][data-h="lo"]').click();await s(300);
ok('TopN copy',cap.split('\n')[0].split('\t').length===5&&cap.split('\n').length>2,cap.slice(0,40));
J.openCopyPanel('pv');await s(300);
ok('Panel offers pivot',d.getElementById('cp-prev').value.startsWith('الجهة')||d.getElementById('cp-prev').value.includes('جدول محوري'),d.getElementById('cp-prev').value.slice(0,30));
d.getElementById('cp-close').click();await s(200);
stub('reject');
J.copyOut('abcdef','<b>abcdef</b>').then(r=>{ok('Fallback returns false',r===false,String(r));});await s(400);
const ta=d.getElementById('cp-prev'),fb=d.getElementById('cpanel');
ok('Fallback panel selected',!!fb&&!fb.hidden&&ta.value==='abcdef'&&ta.selectionStart===0&&ta.selectionEnd===6,'');

ok('Compare tab hidden without previous data',d.querySelector('#tabs [data-tab="cmp"]').hidden,'');
const main=d.getElementById('data-input').value;
d.getElementById('btn-reset').click();await s(500);
d.getElementById('data-input').value=main;
d.getElementById('prev-input').value=main.split('\n').filter((l,i)=>i===0||!l.includes('رمد')).map(l=>l.replace('معمل البرج للتحاليل','معمل قديم')).join('\n');
d.getElementById('btn-analyze').click();await s(2500);
const cb=d.querySelector('#tabs [data-tab="cmp"]');
ok('Compare tab shown with previous data',!cb.hidden&&!!S.prev,'');
cb.click();await s(500);
const cf=J.TABLES.cmpfac.rows({});
ok('Compare new and disappeared',cf.some(r=>String(r[0]).includes('رمد')&&r[5]==='جديد')&&cf.some(r=>String(r[0]).includes('معمل قديم')&&r[5]==='اختفى'),cf.slice(0,3).map(r=>r.join('/')).join(' | '));
ok('Compare current sums to total',cf.reduce((a,r)=>a+r[2],0)===S.total,cf.reduce((a,r)=>a+r[2],0)+' vs '+S.total);
ok('Compare change math',cf.every(r=>r[3]===r[2]-r[1]),'');
ok('Compare renders tables',d.querySelectorAll('#cmp-body table').length>=1&&d.querySelectorAll('#cmp-body tbody tr').length>0,'');
cap='';stub('ok');d.querySelector('#v-cmp .cp-main').click();await s(300);
ok('Compare tab copy',cap.startsWith('مقارنة الجهات')&&cap.split('\n\n').length===3&&cap.split('\n')[1].split('\t').length===6,cap.slice(0,50));
const ct=J.serialize(['cmpfac'],'tsv',{total:true,meta:false}).split('\n'),tl2=ct[ct.length-1].split('\t');
ok('Compare totals row',+tl2[2]===S.total,tl2.join('|'));
d.getElementById('btn-reset').click();await s(400);
d.getElementById('prev-input').value='';d.getElementById('data-input').value=main;d.getElementById('btn-analyze').click();await s(2500);
ok('Compare tab hidden again',d.querySelector('#tabs [data-tab="cmp"]').hidden&&S.prev===null,'');
console.log('RESULT '+P+' passed, '+F+' failed');
}
</script></body></html>
